# ──────────────────────────────────────────────────────────────────────────────
# Porta 8080 → site PÚBLICO (consulta). Porta 8081 → ADMIN (SPA React + API).
# Para HTTPS (após ter domínio), troque 'listen 80/8080;' por 'listen 443 ssl;'
# (e 8443), adicione ssl_certificate/ssl_certificate_key e um redirect 80→443.
# ──────────────────────────────────────────────────────────────────────────────

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Deliberately logs $uri without query strings. Sensitive public searches use
# POST bodies, which nginx does not log.
log_format privacy '$remote_addr - $request_method $uri $status $body_bytes_sent';
access_log /dev/stdout privacy;

# Only the Caddy network may supply client IP metadata. Caddy sanitizes the
# incoming forwarding chain; direct client headers never reach this trust hop.
set_real_ip_from 172.31.0.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Público (alunos)
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 5m;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://consulta:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}

# Administrativo (secretaria) — SPA estático + proxy /api → backend admin.
server {
    listen 8081;
    server_name _;
    server_tokens off;
    client_max_body_size 15m;             # uploads de planilha (.xlsx)
    root /usr/share/nginx/html;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' https://apis.google.com https://www.gstatic.com; connect-src 'self' https://accounts.google.com https://www.googleapis.com; frame-src https://accounts.google.com https://docs.google.com https://drive.google.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # OPCIONAL (recomendado após a fase de testes): restringir por rede do campus.
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny  all;

    location /api/ {
        proxy_pass http://admin:8000/;     # a barra final remove o prefixo /api
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;           # emissão é assíncrona; HTTP fica curto
        proxy_send_timeout 120s;
    }

    location /consulta-api/ {
        proxy_pass http://consulta:8001/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA React: rotas do cliente caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
